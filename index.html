<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidnightFlix</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="site-header">
    <h1>🎬 MidnightFlix</h1>
    <p>Your Ultimate Movie Recommendation Website</p>
</header>

<div class="container">

    <!-- Search -->
    <div id="movie-search">

        <input
            type="text"
            id="movie-input"
            placeholder="Search Movie..."
        >

        <button id="search-btn">
            Search
        </button>

    </div>

    <!-- Filters -->

    <div id="filters">

        <select id="genre-filter">
            <option value="">All Genres</option>
        </select>

        <select id="year-filter">

            <option value="">All Years</option>

            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
            <option value="2016">2016</option>
            <option value="2015">2015</option>
            <option value="2014">2014</option>
            <option value="2013">2013</option>
            <option value="2012">2012</option>
            <option value="2011">2011</option>
            <option value="2010">2010</option>

        </select>

        <select id="rating-filter">

            <option value="">All Ratings</option>

            <option value="9">9+</option>
            <option value="8">8+</option>
            <option value="7">7+</option>
            <option value="6">6+</option>
            <option value="5">5+</option>
            <option value="4">4+</option>

        </select>

        <select id="language-filter">

            <option value="">All Languages</option>

            <option value="en">English</option>
            <option value="hi">Hindi</option>

        </select>

    </div>

    <!-- Loading -->

    <div id="loading-spinner">

        Loading Movies...

    </div>

    <!-- Movies -->

    <div id="recommendations"></div>

    <!-- Pagination -->

    <div id="pagination-controls">

        <button id="prev-btn">

            ◀ Previous

        </button>

        <button id="next-btn">

            Next ▶

        </button>

    </div>

</div>

<!-- Movie Details -->

<div id="movie-details-modal" class="modal">

    <div class="modal-content">

        <span class="close-btn" onclick="closeMovieDetails()">

            &times;

        </span>

        <div id="movie-details-content">

        </div>

    </div>

</div>

<!-- Trailer -->

<div id="trailer-modal" class="modal">

    <div class="modal-content">

        <span class="close-btn" onclick="closeTrailer()">

            &times;

        </span>

        <div id="movie-trailer">

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
